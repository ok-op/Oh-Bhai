<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraBox Video Stream & Download</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c1221 0%, #0f172a 100%);
            color: #f0f0f0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 7, 100, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(67, 97, 238, 0.15) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            padding: 20px;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            animation: fadeIn 1s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo i {
            font-size: 3.5rem;
            background: linear-gradient(45deg, #4cc9f0, #4361ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-right: 15px;
            filter: drop-shadow(0 0 10px rgba(76, 201, 240, 0.5));
        }

        h1 {
            font-size: 2.8rem;
            background: linear-gradient(45deg, #4cc9f0, #f72585);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
            font-weight: 300;
        }

        .input-section {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08);
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: slideUp 0.8s ease;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            font-size: 1.3rem;
            font-weight: 600;
            color: #4cc9f0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 0; /* Allow input to shrink */
            padding: 16px 22px;
            border-radius: 15px;
            border: none;
            background: rgba(15, 23, 42, 0.7);
            color: #f8f9fa;
            font-size: 1.05rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            border: 2px solid rgba(76, 201, 240, 0.2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        input:focus {
            outline: none;
            border-color: #4cc9f0;
            box-shadow: 0 0 0 4px rgba(76, 201, 240, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.05);
        }

        .submit-btn {
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
            color: white;
            border: none;
            padding: 16px 35px;
            border-radius: 15px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20px;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(25deg);
            transition: all 0.6s;
        }

        .submit-btn:hover::after {
            left: 120%;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(67, 97, 238, 0.6);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        .submit-btn i {
            font-size: 1.15rem;
        }

        .result-section {
            display: none;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08);
            margin-top: 20px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.8s ease;
        }

        .video-container {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            background: #000;
            position: relative;
            aspect-ratio: 16/9;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .resolution-badge {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .info-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-box {
            flex: 1;
            min-width: 250px;
            background: rgba(15, 23, 42, 0.7);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .info-title {
            font-size: 1.05rem;
            color: #4cc9f0;
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-value {
            font-size: 1.15rem;
            font-weight: 500;
            color: #f8f9fa;
            word-break: break-word;
            line-height: 1.4;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            border-radius: 15px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
            z-index: -1;
        }

        .action-btn:hover::before {
            transform: translateX(100%);
        }

        .download-btn {
            background: linear-gradient(45deg, #f72585, #b5179e);
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(247, 37, 133, 0.5);
        }

        .stream-btn {
            background: linear-gradient(45deg, #4cc9f0, #4895ef);
        }

        .stream-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(76, 201, 240, 0.5);
        }

        .developer {
            text-align: center;
            margin-top: 40px;
            color: #94a3b8;
            font-size: 1rem;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 800px;
        }

        .developer a {
            color: #4cc9f0;
            text-decoration: none;
            transition: all 0.3s;
        }

        .developer a:hover {
            text-decoration: underline;
            color: #f72585;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(76, 201, 240, 0.3);
            border-top: 5px solid #4cc9f0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .status-indicator {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 500;
            display: inline-block;
            margin-top: 10px;
        }
        
        .status-success {
            background-color: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        
        .status-error {
            background-color: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .input-container {
                flex-direction: column;
            }
            
            .submit-btn {
                width: 100%;
                justify-content: center;
            }
            
            h1 {
                font-size: 2.3rem;
            }
            
            .input-section, .result-section {
                padding: 25px;
            }
            
            .action-buttons {
                flex-direction: column;
                gap: 15px;
            }
            
            .action-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-play-circle"></i>
            </div>
            <h1>TeraBox Video Stream & Download</h1>
            <p class="subtitle">Paste any TeraBox link to instantly stream and download high-quality videos</p>
        </header>

        <section class="input-section">
            <div class="input-group">
                <label for="video-link">
                    <i class="fas fa-link"></i> Enter TeraBox Video URL
                </label>
                <div class="input-container">
                    <input type="url" id="video-link" placeholder="https://teraboxapp.com/s/..." required>
                    <button class="submit-btn" id="submit-btn">
                        <i class="fas fa-paper-plane"></i> Process Video
                    </button>
                </div>
            </div>
        </section>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing your video link, please wait...</p>
        </div>

        <section class="result-section" id="result-section">
            <div class="video-container">
                <video id="video-player" controls>
                    Your browser does not support the video tag.
                </video>
                <div class="resolution-badge" id="resolution-badge">1080p</div>
            </div>

            <div class="info-container">
                <div class="info-box">
                    <div class="info-title">
                        <i class="fas fa-file-video"></i> Video Title
                    </div>
                    <div class="info-value" id="file-name">-</div>
                </div>
                
                <div class="info-box">
                    <div class="info-title">
                        <i class="fas fa-weight-hanging"></i> File Size
                    </div>
                    <div class="info-value" id="file-size">-</div>
                </div>
                
                <div class="info-box">
                    <div class="info-title">
                        <i class="fas fa-info-circle"></i> Status
                    </div>
                    <div class="info-value">
                        <span class="status-indicator" id="status">Awaiting input</span>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <a href="#" class="action-btn download-btn" id="download-btn" target="_blank">
                    <i class="fas fa-download"></i> Download Video
                </a>
                <a href="#" class="action-btn stream-btn" id="stream-btn" target="_blank">
                    <i class="fas fa-play-circle"></i> Stream Video
                </a>
            </div>
        </section>

        <div class="developer">
            Powered by <a href="https://t.me/Farooq_is_king" target="_blank">𝐖𝐎𝐎𝐃𝐜𝐫𝐚𝐟𝐭</a> • Premium Video Streaming Service
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const submitBtn = document.getElementById('submit-btn');
            const videoLink = document.getElementById('video-link');
            const resultSection = document.getElementById('result-section');
            const loading = document.getElementById('loading');
            const videoPlayer = document.getElementById('video-player');
            const fileName = document.getElementById('file-name');
            const fileSize = document.getElementById('file-size');
            const statusEl = document.getElementById('status');
            const downloadBtn = document.getElementById('download-btn');
            const streamBtn = document.getElementById('stream-btn');
            const resolutionBadge = document.getElementById('resolution-badge');
            
            // API endpoint
            const API_ENDPOINT = "https://silent-noor-stream-api.woodmirror.workers.dev/api?url=";
            
            submitBtn.addEventListener('click', function(e) {
                e.preventDefault();
                
                const url = videoLink.value.trim();
                if (!url) {
                    showError("Please enter a video URL");
                    return;
                }
                
                // Validate URL format
                if (!isValidUrl(url)) {
                    showError("Please enter a valid URL");
                    return;
                }
                
                // Show loading
                loading.style.display = 'block';
                resultSection.style.display = 'none';
                
                // Encode the URL for API call
                const encodedUrl = encodeURIComponent(url);
                const apiUrl = API_ENDPOINT + encodedUrl;
                
                // Make API call
                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        // Hide loading
                        loading.style.display = 'none';
                        
                        // Check if API returned success
                        if (data.status && data.status.includes("Successfully")) {
                            updateUI(data);
                        } else {
                            showError("Failed to process video: " + (data.message || "Unknown error"));
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        loading.style.display = 'none';
                        showError("Error fetching video data. Please try again.");
                    });
            });
            
            function updateUI(data) {
                // Set video source
                videoPlayer.src = data.streaming_url;
                         
                // Set resolution badge
                const resolution = getResolution(data.file_size);
                resolutionBadge.textContent = resolution;
                
                // Set info
                fileName.textContent = data.file_name || "Unknown Video";
                fileSize.textContent = data.file_size || "Unknown size";
                statusEl.textContent = data.status || "✅ Ready";
                statusEl.className = "status-indicator status-success";
                
                // Set download link
                downloadBtn.href = data.proxy_url || "#";
                downloadBtn.setAttribute('download', data.file_name || "video.mp4");
                
                // Set stream link
                streamBtn.href = data.streaming_url || "#";
                
                // Show result section with animation
                resultSection.style.display = 'block';
                
                // Scroll to results
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            
            function getResolution(fileSize) {
                // Simplified logic to determine resolution based on file size
                if (!fileSize) return "HD";
                
                const sizeInMB = parseFloat(fileSize);
                if (sizeInMB > 500) return "1080p";
                if (sizeInMB > 200) return "720p";
                if (sizeInMB > 100) return "480p";
                return "SD";
            }
            
            function showError(message) {
                statusEl.textContent = message;
                statusEl.className = "status-indicator status-error";
                
                // Show result section to display error
                resultSection.style.display = 'block';
                loading.style.display = 'none';
                
                // Scroll to status
                statusEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            function isValidUrl(string) {
                try {
                    new URL(string);
                    return true;
                } catch (_) {
                    return false;
                }
            }
        });
    </script>
</body>
</html>
